[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "insta-genie"
version = "1.0.0"
description = "AI-powered Instagram automation agent integrating Meta Graph API and Cloudflare Workers AI"
readme = "../README.md"
requires-python = ">=3.10"
authors = [
    { name = "Insta Genie Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Social Media",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "Pillow>=10.3.0",
    "apscheduler>=3.10.4",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
    "click>=8.1.7"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.4.4"
]

[project.scripts]
insta-genie = "python_service.main:cli"

[tool.pytest.ini_options]
pythonpath = ["..", "."]
asyncio_mode = "auto"

