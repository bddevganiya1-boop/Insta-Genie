name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-tests:
    name: Python Unit Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python_service/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Test Suite
        env:
          DRY_RUN: "true"
        run: |
          pytest python_service/tests -v

  node-worker-check:
    name: Cloudflare Worker TypeScript Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node Worker dependencies
        run: |
          cd node_worker
          npm install

      - name: Typecheck TypeScript Worker
        run: |
          cd node_worker
          npx tsc --noEmit
